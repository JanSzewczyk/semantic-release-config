name: PR Checks ✅

on:
  pull_request:

env:
  NODE_VERSION: 22.x

jobs:
  prettier:
    name: Prettier 🧹
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Set up Node 🟢
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install packages ⚙️
        run: npm ci
      - name: Prettier Check 🧹
        run: npm run prettier:check

  lint:
    name: ESlint ⬣
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Set up Node 🟢
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies ⚙️
        run: npm ci
      - name: Install utils ⚙️
        run: npm install @microsoft/eslint-formatter-sarif
      - name: ESlint Check ⬣
        run: npm run lint:ci
        continue-on-error: true
      - name: Upload ESlint results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

  build:
    name: Build 🏗️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Set up Node 🟢
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install packages ⚙️
        run: npm ci
      - name: Build Check 🏗️
        run: npm run build

  dependency-review:
    name: Dependency Review 👀
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Dependency Review 👀
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure
          # brace-expansion and ip-address are bundled inside the "npm" package itself
          # (a transitive dependency of @semantic-release/npm, used only to publish).
          # Every published npm CLI release still ships these vulnerable versions, so
          # there is currently no version we can pin to that avoids the finding.
          allow-ghsas: |
            GHSA-6j4f-fj2g-mc7p
            GHSA-qhr7-859c-m2p7
            GHSA-q2hr-2g5m-vwhr
            GHSA-2vr4-cq9g-pvrc
            GHSA-rpw4-54j3-4h4q
            GHSA-h3mg-xc3c-68pw
            GHSA-j6r3-76f7-8jcv
