name: PR Checks ✅

on:
  pull_request:

env:
  NODE_VERSION: 22.x

jobs:
  biome:
    name: Biome 🌿
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Setup Biome 🌿
        uses: biomejs/setup-biome@v2
      - name: Biome Check 🌿
        run: npm run biome:ci

  build:
    name: Build 🏗️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Set up Node 🟢
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install packages ⚙️
        run: npm ci
      - name: Build Check 🏗️
        run: npm run build

  dependency-review:
    name: Dependency Review 👀
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code 📚
        uses: actions/checkout@v7
      - name: Dependency Review 👀
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure
          # brace-expansion, ip-address, http-cache-semantics, postcss-selector-parser and
          # undici are bundled inside the "npm" package itself (a transitive dependency of
          # @semantic-release/npm, used only to publish). Every published npm CLI release
          # still ships these vulnerable versions, so there is currently no version we can
          # pin to that avoids the finding. braces has no fixed release published upstream
          # yet (latest is still 3.0.3), so it is allowed for the same practical reason.
          allow-ghsas:
            "GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr, GHSA-2vr4-cq9g-pvrc, GHSA-rpw4-54j3-4h4q,
            GHSA-h3mg-xc3c-68pw, GHSA-j6r3-76f7-8jcv, GHSA-ch52-4w7c-c8xp, GHSA-rj75-hqrm-r3gf, GHSA-3wwx-pv8p-q78v,
            GHSA-r53p-7pc4-xj5r, GHSA-rfgv-xxqx-mfg5, GHSA-vfj7-8cjw-p6xm"
